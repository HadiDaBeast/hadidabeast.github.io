name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Test — ingestion-service
  # ---------------------------------------------------------------------------
  lint-and-test-ingestion:
    name: Lint & Test / ingestion-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ingestion-service/requirements.txt

      - name: Install dependencies
        run: pip install ruff==0.4.7 && pip install -r requirements.txt
        working-directory: ingestion-service

      - name: Run ruff (ingestion-service)
        run: ruff check app tests
        working-directory: ingestion-service

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql://test:test@localhost/test"
          APP_VERSION: "ci"
        run: pytest tests/ -v --tb=short
        working-directory: ingestion-service

  # ---------------------------------------------------------------------------
  # Lint + Test — api-service
  # ---------------------------------------------------------------------------
  lint-and-test-api:
    name: Lint & Test / api-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api-service/requirements.txt

      - name: Install dependencies
        run: pip install ruff==0.4.7 && pip install -r requirements.txt
        working-directory: api-service

      - name: Run ruff (api-service)
        run: ruff check app tests
        working-directory: api-service

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql://test:test@localhost/test"
          APP_VERSION: "ci"
        run: pytest tests/ -v --tb=short
        working-directory: api-service

  # ---------------------------------------------------------------------------
  # Validate Kubernetes manifests
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: Validate / k8s manifests
    runs-on: ubuntu-latest
    needs: [lint-and-test-ingestion, lint-and-test-api]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate manifests with kubectl --dry-run=client
        run: |
          echo "Validating all manifests in k8s/..."
          find k8s/ -name "*.yaml" -o -name "*.yml" | sort | while read -r manifest; do
            echo "  -> $manifest"
            kubectl apply --dry-run=client --validate=false -f "$manifest"
          done
          echo "All manifests validated successfully."

      - name: Check for hardcoded credentials in manifests
        run: |
          echo "Checking for CHANGEME in non-comment lines of k8s/ manifests..."
          # Find any line that is NOT a comment (doesn't start with optional whitespace + #)
          # and contains CHANGEME — this would indicate a real credential slipped through.
          BAD=$(grep -rn 'CHANGEME' k8s/ \
            | grep -v '^\s*#' \
            | grep -v 'CHANGEME_REPLACE_BEFORE_DEPLOY' \
            || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: Found unexpected CHANGEME value in k8s manifests:"
            echo "$BAD"
            exit 1
          fi
          echo "No unexpected credentials found."
