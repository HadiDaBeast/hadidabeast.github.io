name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # Only push on push events, not PRs
    strategy:
      matrix:
        service: [ingestion, api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          echo "tag=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine service directory
        id: dir
        run: |
          case "${{ matrix.service }}" in
            ingestion) echo "dir=ingestion-service" >> $GITHUB_OUTPUT ;;
            api)       echo "dir=api-service"       >> $GITHUB_OUTPUT ;;
            frontend)  echo "dir=frontend"          >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.dir.outputs.dir }}
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            hadidabeast/prispulsen-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            hadidabeast/prispulsen-${{ matrix.service }}:latest
