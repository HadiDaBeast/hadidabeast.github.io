<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prispulsen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticket">
        <header>
            <p class="eyebrow">Karlskrona · 7 butiker</p>
            <h1>Prispulsen</h1>
            <div class="header-row">
                <p class="last-updated" id="last-updated">Laddar...</p>
            </div>
        </header>

        <div class="perforation" aria-hidden="true"></div>

        <main id="main-content">
            <p class="empty">Laddar priser...</p>
        </main>
    </div>

    <script>
        // Static site, no backend — everything comes from the JSON files
        // export.py writes each week. See project-plan.md for the pipeline.

        function formatPrice(n) {
            return n === null || n === undefined ? null : n.toFixed(2);
        }

        function renderOffers(offers) {
            const main = document.getElementById("main-content");

            if (!offers || offers.length === 0) {
                main.innerHTML = '<p class="empty">Inga erbjudanden just nu.</p>';
                return;
            }

            const rows = offers.map((o) => {
                const price = formatPrice(o.price);
                const unitPrice = formatPrice(o.unit_price);
                const unitCell = unitPrice
                    ? `${unitPrice} kr/${o.base_unit || "?"}`
                    : '<span class="muted">—</span>';
                const validUntil = o.valid_until ? o.valid_until.slice(0, 10) : "—";

                return `<tr>
                    <td>${o.product}</td>
                    <td>${o.store}</td>
                    <td class="num">${price !== null ? price + " kr" : "—"}</td>
                    <td class="num">${unitCell}</td>
                    <td>${validUntil}</td>
                </tr>`;
            }).join("");

            main.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Produkt</th>
                            <th>Butik</th>
                            <th class="num">Pris</th>
                            <th class="num">Jämförpris</th>
                            <th>Giltigt t.o.m.</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        async function loadData() {
            try {
                const [currentRes, metaRes] = await Promise.all([
                    fetch("data/current.json"),
                    fetch("data/meta.json"),
                ]);

                if (!currentRes.ok || !metaRes.ok) {
                    throw new Error("Data files not found — has the weekly pipeline run yet?");
                }

                const offers = await currentRes.json();
                const meta = await metaRes.json();

                document.getElementById("last-updated").textContent = meta.last_updated
                    ? `Senast uppdaterad ${meta.last_updated} UTC`
                    : "Inga priser hämtade än";

                renderOffers(offers);
            } catch (err) {
                document.getElementById("last-updated").textContent = "Kunde inte ladda priser";
                document.getElementById("main-content").innerHTML =
                    `<p class="empty">Kunde inte hämta prisdata. (${err.message})</p>`;
                console.error(err);
            }
        }

        loadData();
    </script>
</body>
</html>
