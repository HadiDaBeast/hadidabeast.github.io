apiVersion: apps/v1
kind: Deployment
metadata:
  name: prispulsen-ingestion
  namespace: prispulsen
  labels:
    app: prispulsen-ingestion
    component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prispulsen-ingestion
  template:
    metadata:
      labels:
        app: prispulsen-ingestion
        component: ingestion
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: ingestion
          image: hadidabeast/prispulsen-ingestion:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prispulsen-secrets
                  key: DATABASE_URL
            - name: TJEK_API_URL
              valueFrom:
                configMapKeyRef:
                  name: prispulsen-config
                  key: TJEK_API_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: prispulsen-config
                  key: LOG_LEVEL
            - name: APP_VERSION
              value: latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
