apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prispulsen-ingress
  namespace: prispulsen
  labels:
    app: prispulsen
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: prispulsen.nu
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prispulsen-api
                port:
                  number: 8001
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prispulsen-frontend
                port:
                  number: 8080
    # Local development fallback (NodePort access)
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prispulsen-api
                port:
                  number: 8001
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prispulsen-frontend
                port:
                  number: 8080
