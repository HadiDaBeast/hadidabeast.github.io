apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prispulsen-ingestion-hpa
  namespace: prispulsen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prispulsen-ingestion
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
