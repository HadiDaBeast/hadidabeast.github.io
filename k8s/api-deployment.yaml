apiVersion: apps/v1
kind: Deployment
metadata:
  name: prispulsen-api
  namespace: prispulsen
  labels:
    app: prispulsen-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prispulsen-api
  template:
    metadata:
      labels:
        app: prispulsen-api
        component: api
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: api
          image: hadidabeast/prispulsen-api:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prispulsen-secrets
                  key: DATABASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: prispulsen-config
                  key: LOG_LEVEL
            - name: APP_VERSION
              value: latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
