apiVersion: apps/v1
kind: Deployment
metadata:
  name: prispulsen-frontend
  namespace: prispulsen
  labels:
    app: prispulsen-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prispulsen-frontend
  template:
    metadata:
      labels:
        app: prispulsen-frontend
        component: frontend
    spec:
      securityContext:
        runAsUser: 65534  # nobody
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: frontend
          image: taylorbourne/prispulsen-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: API_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: prispulsen-config
                  key: API_SERVICE_URL
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
